org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround temporal: el compilador incremental de Kotlin (Build Tools API)
# choca al registrar el mismo archivo de caché dos veces en esta máquina
# Windows ("already registered" en compileDebugKotlin), un bug conocido de
# Gradle/Kotlin no relacionado con el código de la app. Se puede revertir
# apenas se actualice el toolchain.
kotlin.incremental=false
