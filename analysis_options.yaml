# Análisis estático de finance-app.
#
# Reglas endurecidas sobre flutter_lints. La intención es que el analizador
# atrape lo que la constitución exige antes de que llegue a una revisión.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Un import sin usar en lib/dominio/ suele ser el rastro de una dependencia
    # que se coló y luego se quitó a medias.
    unused_import: error
    unused_local_variable: error
    # Los TODO no se acumulan en silencio.
    todo: info
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Inmutabilidad: los modelos del dominio son valores, no bolsas mutables.
    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Claridad de tipos: nada implícito en la capa financiera.
    - always_declare_return_types
    - avoid_dynamic_calls
    - omit_local_variable_types

    # Errores silenciosos.
    - avoid_catches_without_on_clauses
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures

    # Legibilidad.
    - avoid_positional_boolean_parameters
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - use_super_parameters
